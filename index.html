<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c296b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Rex Medical Centre - Trusted Healthcare Services</title>
    <meta name="description" content="Welcome to Rex Medical Centre. We provide quality healthcare, expert doctors, and advanced medical services." />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking: text shows in a system font first, then switches to Inter (display=swap). Improves mobile first paint. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

    <!-- Font Awesome Icons (non-blocking: page paint is not held up by this stylesheet) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" /></noscript>

    <!-- HTTPS: GitHub Pages "Enforce HTTPS" is the main switch; this is a backup for the live domain only -->
    <script>
      if (location.protocol === 'http:' && /(^|\.)rexmedcomplex\.com$/.test(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    </script>

    <!-- Search engine verification (owner step): paste the content value from Google Search Console / Bing Webmaster Tools,
         then remove the comment markers. Alternative: put the verification file they give you inside public/.
    <meta name="google-site-verification" content="PASTE_GOOGLE_CODE_HERE" />
    <meta name="msvalidate.01" content="PASTE_BING_CODE_HERE" />
    -->

    <!-- Google Analytics 4 (admin/login pages ginti mein shamil nahi) -->
    <script>
      (function () {
        if (/^\/(admin|login)/i.test(window.location.pathname)) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-K39N622R6D';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-K39N622R6D');
      })();
    </script>
  </head>
  <body class="font-sans antialiased text-gray-800 bg-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
